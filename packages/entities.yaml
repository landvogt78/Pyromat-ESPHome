# Messwerte werden bei ausbleibenden Telegrammen ungueltig statt eingefroren.
# Kein delta-Filter: auch konstante, erneut empfangene Werte halten den Timeout frisch.
sensor:
  - platform: template
    id: kesseltemperatur
    name: "Kesseltemperatur"
    update_interval: never
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters:
      - timeout: 60s

  - platform: template
    id: soll_kesseltemperatur
    name: "Kesseltemperatur Soll"
    update_interval: never
