    update_interval: never
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - timeout: 60s

  - platform: template
    id: ventil_puffer
    name: "Register 0x007E W2 Rohwert"
    update_interval: never
    accuracy_decimals: 0
