  - platform: template
    id: betriebsstatus_rohwert
    name: "Betriebsstatus Rohwert"
    update_interval: never
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - timeout: 60s

  - platform: template
    id: can_datenalter
    name: CAN Datenalter
    unit_of_measurement: s
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (!id(can_seen)) return NAN;
      return static_cast<uint32_t>(millis() - id(last_can_ms)) / 1000.0f;

  - platform: template
    id: can_telegramme
    name: CAN Telegramme
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(can_frames);

  - platform: wifi_signal
    id: wlan_signal
    name: WLAN Signal
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    id: betriebszeit
    name: Betriebszeit
    update_interval: 30s
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: WLAN Verbindung
    device_class: connectivity
    entity_category: diagnostic
    lambda: return wifi::global_wifi_component->is_connected();
  - platform: template
    id: can_empfang
    name: CAN Empfang
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(can_seen) && static_cast<uint32_t>(millis() - id(last_can_ms)) <= 30000;

text_sensor:
  - platform: template
    id: kesseluhr
    name: Kesseluhr
    icon: mdi:clock-outline
    update_interval: 5s
    lambda: |-
      const auto value = id(boiler_clock).time(millis());
      return value.empty() ? std::string("Keine Daten") : value;
  - platform: template
    id: kesseldatum
    name: Kesseldatum
    icon: mdi:calendar
    update_interval: 5s
    lambda: |-
      const auto value = id(boiler_clock).date(millis());
      return value.empty() ? std::string("Keine Daten") : value;
  - platform: template
    id: kesselwochentag
    name: Kesselwochentag
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(boiler_clock).weekday(millis());
  - platform: wifi_info
    ip_address:
      name: IP Adresse
      entity_category: diagnostic
    ssid:
      name: WLAN Name
      entity_category: diagnostic
